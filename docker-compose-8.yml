# Stack 8 (espelho do docker-compose.yml/compose-2.yml). Landing fica só no compose-2.
#
# Sobe ao lado dos outros stacks com:
#   docker compose -f docker-compose-8.yml up -d
#
# Acessos:
#   - http://localhost:5175  → landing (no compose-2), agora com 8 cards (A, B, C, D, E, F, G, H)
#   - http://localhost:5181  → web do Stack 8 (Ambiente H / Chip H)
#   - http://localhost:5087  → API do Stack 8
#   - http://localhost:5439  → Postgres do Stack 8 (porta diferente dos demais)
#   - http://localhost:3007  → WAHA do Stack 8 (parear o oitavo celular aqui)
#
# Defaults pra DEV LOCAL. Em outro setup sobrescreva via .env (não commitado).

name: mtrx8

services:
  postgres:
    image: postgres:17-alpine
    container_name: mtrx8-postgres
    environment:
      POSTGRES_DB: mtrx
      POSTGRES_USER: mtrx
      POSTGRES_PASSWORD: ${PG8_PASS:-mtrx}
      TZ: UTC
    ports:
      - "${MTRX_BIND:-127.0.0.1}:5439:5432"
    volumes:
      - pgdata8:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mtrx", "-d", "mtrx"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtrx8-redis
    ports:
      - "${MTRX_BIND:-127.0.0.1}:6386:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: mtrx8-waha
    ports:
      - "${MTRX_BIND:-127.0.0.1}:3007:3000"
    environment:
      TZ: UTC
      # Engine NOWEB (sem Chromium) — ver docker-compose.yml. Reparear o chip após a troca.
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-NOWEB}
      # NAO ha proxy aqui: o WAHA 2026.x (CORE/NOWEB) IGNORA a env var WHATSAPP_PROXY_SERVER
      # (comprovado). O proxy por chip e aplicado no CONFIG DA SESSAO pela api (Waha__Proxy*).
      # Ver docs/proxy.md.
      # Bypass do proxy pro host INTERNO (api): sem isto, ao ligar um proxy o webhook
      # (waha -> http://api:8080/...) pode ir pelo proxy externo e o "SAIR" para de chegar
      # em silencio (risco de ban). Ver docs/proxy.md.
      NO_PROXY: "api,localhost,127.0.0.1"
      no_proxy: "api,localhost,127.0.0.1"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA8_DASH_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA8_DASH_PASS:-admin}
      WHATSAPP_API_KEY: ${WAHA8_API_KEY:-mtrxsys-dev-key-stack8}
      # Webhook aponta pro nome interno do serviço (resolvido pela rede do projeto mtrx8)
      WHATSAPP_HOOK_URL: ${WAHA8_HOOK_URL:-http://api:8080/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: ${WAHA8_HOOK_EVENTS:-message,message.any}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA8_SWAGGER_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA8_SWAGGER_PASS:-admin}
    volumes:
      - waha-sessions8:/app/.sessions
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/MtrxSys.Api/Dockerfile
    container_name: mtrx8-api
    ports:
      - "${MTRX_BIND:-127.0.0.1}:5087:8080"
    environment:
      TZ: UTC
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG8_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA8_API_KEY:-mtrxsys-dev-key-stack8}
      Waha__WebhookCallbackUrl: "http://api:8080/webhooks/waha"
      # Proxy por chip (anti-correlacao de IP): aplicado no config da sessao via API do WAHA.
      # Vazio = sem proxy (sai pelo IP da maquina). Formato host:porta (sem http://). docs/proxy.md.
      Waha__ProxyServer: ${WAHA_PROXY_8:-}
      Waha__ProxyUsername: ${WAHA_PROXY_8_USER:-}
      Waha__ProxyPassword: ${WAHA_PROXY_8_PASS:-}
      # Aparelho virtual (aba "Celular") — pronto no papel, DESLIGADO por padrão (ViewUrl vazio): sem
      # KVM/servidor nada sobe. Container/porta/volume ÚNICOS por ambiente (1 host, 10 stacks).
      Phone__ContainerName: ${PHONE_CONTAINER_8:-mtrx8-android}
      Phone__ViewUrl: ${PHONE_VIEW_URL_8:-}
      Phone__NoVncPort: ${PHONE_NOVNC_PORT_8:-6087}
      Phone__VolumeName: ${PHONE_VOLUME_8:-android-data-8}
      Phone__WhatsAppApkUrl: ${PHONE_WA_APK_URL_8:-}
      Presence__MaskChipPhone: ${MASK_CHIP_PHONE_8:-false}
      Webhooks__WahaToken: ${WAHA8_HOOK_TOKEN:-}
      # Chave JWT distinta dos demais Stacks: tokens emitidos noutro stack não autenticam aqui
      Jwt__SigningKey: ${JWT8_SIGNING_KEY:-dev-only-signing-key-stack-8-change-me-32-chars-min}
      # Admin específico do Ambiente H — diferente dos outros pra ficar claro qual ambiente é qual
      Seed__Admin__Email: ${SEED8_ADMIN_EMAIL:-admin-h@local}
      Seed__Admin__Password: ${SEED8_ADMIN_PASS:-chipH123!}
      Seed__Admin__DisplayName: ${SEED8_ADMIN_NAME:-Admin Chip H}
    volumes:
      # Socket do Docker: deixa a API ligar/parar/logar o container do emulador (deploy Linux).
      # Sem o socket acessível, a aba "Celular" mostra "indisponível" (fail-safe).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: src/MtrxSys.Dispatcher/Dockerfile
    container_name: mtrx8-dispatcher
    environment:
      TZ: UTC
      DOTNET_ENVIRONMENT: Production
      # URL pública por onde o destinatário alcança ESTA API (link de "sair" de 1 clique no rodapé).
      # Vazio = link desligado (só "responda SAIR"). Defina OPTOUT_PUBLIC_URL_8 no .env no servidor.
      OptOut__PublicBaseUrl: ${OPTOUT_PUBLIC_URL_8:-}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG8_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA8_API_KEY:-mtrxsys-dev-key-stack8}
      Jwt__SigningKey: ${JWT8_SIGNING_KEY:-dev-only-signing-key-stack-8-change-me-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      args:
        # Cliente web do Stack 8 chama a API do Stack 8 (porta 5087). Build-time via Vite.
        VITE_API_URL: "http://localhost:5087"
        # Aparelho virtual: build args do emulador embutido (vazio = desligado, igual A/B).
        VITE_EMULATOR_URL: ${PHONE_VIEW_URL_8:-}
        VITE_EMULATOR_KIND: ${PHONE_VIEWER_KIND_8:-}
        VITE_PHONE_SERVER: ${PHONE_SERVER_OPTION_8:-}
        VITE_EMULATOR_UDID: ${PHONE_UDID_8:-}
        # Identifica a aba do navegador como "MtrxSys H" pra distinguir dos outros.
        VITE_APP_LABEL: "H"
    container_name: mtrx8-web
    ports:
      - "${MTRX_BIND:-127.0.0.1}:5181:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata8:
  waha-sessions8:
