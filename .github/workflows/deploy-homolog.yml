name: Deploy Homolog

# Auto-deploy no ambiente de HOMOLOGAÇÃO quando o CI passa na main (ou disparo manual). Rsync do
# código pro OVH + rebuild do stack ISOLADO mtrxhml (up-homolog.sh). NÃO toca nos 10 de prod.
# Requer o secret DEPLOY_SSH_KEY (chave privada de deploy). Host/usuário/host-key são públicos e
# ficam aqui no arquivo (repo privado).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-homolog
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 198.27.75.37
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /home/ubuntu/MtrxSys

jobs:
  deploy:
    # Só roda se o CI passou (senão um CI vermelho ainda deployaria). Disparo manual sempre roda.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura SSH (chave de deploy + host key fixo)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "198.27.75.37 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFtbgCJnnpRhEEMDs7JOICIbqBFRVRyt53WhdSLYZQGg" > ~/.ssh/known_hosts

      - name: Rsync do código pro servidor (sem tocar segredos/artefatos/dados)
        run: |
          rsync -az \
            --exclude '.git' --exclude 'node_modules' --exclude 'bin' --exclude 'obj' \
            --exclude 'dist' --exclude 'deploy/.env*' --exclude 'deploy/Caddyfile' \
            --exclude 'deploy/landing' --exclude 'searxng' --exclude 'tmp' --exclude '*.tar.gz' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Rebuild do homolog (mtrxhml — isolado dos 10)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd ~/MtrxSys && sed -i "s/\r$//" deploy/up-homolog.sh docker-compose-hml.yml && bash deploy/up-homolog.sh'
