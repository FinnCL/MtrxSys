# Stack 4 (espelho do docker-compose.yml/compose-2.yml). Landing fica só no compose-2.
#
# Sobe ao lado dos outros stacks com:
#   docker compose -f docker-compose-4.yml up -d
#
# Acessos:
#   - http://localhost:5175  → landing (no compose-2), agora com 4 cards (A, B, C, D)
#   - http://localhost:5177  → web do Stack 4 (Ambiente D / Chip D)
#   - http://localhost:5083  → API do Stack 4
#   - http://localhost:5435  → Postgres do Stack 4 (porta diferente dos demais)
#   - http://localhost:3003  → WAHA do Stack 4 (parear o quarto celular aqui)
#
# Defaults pra DEV LOCAL. Em outro setup sobrescreva via .env (não commitado).

name: mtrx4

services:
  postgres:
    image: postgres:17-alpine
    container_name: mtrx4-postgres
    environment:
      POSTGRES_DB: mtrx
      POSTGRES_USER: mtrx
      POSTGRES_PASSWORD: ${PG4_PASS:-mtrx}
      TZ: UTC
    ports:
      - "5435:5432"
    volumes:
      - pgdata4:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mtrx", "-d", "mtrx"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtrx4-redis
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: mtrx4-waha
    ports:
      - "3003:3000"
    environment:
      TZ: UTC
      # Engine NOWEB (sem Chromium) — ver docker-compose.yml. Reparear o chip após a troca.
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-NOWEB}
      # NAO ha proxy aqui: o WAHA 2026.x (CORE/NOWEB) IGNORA a env var WHATSAPP_PROXY_SERVER
      # (comprovado). O proxy por chip e aplicado no CONFIG DA SESSAO pela api (Waha__Proxy*).
      # Ver docs/proxy.md.
      # Bypass do proxy pro host INTERNO (api): sem isto, ao ligar um proxy o webhook
      # (waha -> http://api:8080/...) pode ir pelo proxy externo e o "SAIR" para de chegar
      # em silencio (risco de ban). Ver docs/proxy.md.
      NO_PROXY: "api,localhost,127.0.0.1"
      no_proxy: "api,localhost,127.0.0.1"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA4_DASH_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA4_DASH_PASS:-admin}
      WHATSAPP_API_KEY: ${WAHA4_API_KEY:-mtrxsys-dev-key-stack4}
      # Webhook aponta pro nome interno do serviço (resolvido pela rede do projeto mtrx4)
      WHATSAPP_HOOK_URL: ${WAHA4_HOOK_URL:-http://api:8080/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: ${WAHA4_HOOK_EVENTS:-message,message.any}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA4_SWAGGER_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA4_SWAGGER_PASS:-admin}
    volumes:
      - waha-sessions4:/app/.sessions
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/MtrxSys.Api/Dockerfile
    container_name: mtrx4-api
    ports:
      - "5083:8080"
    environment:
      TZ: UTC
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG4_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA4_API_KEY:-mtrxsys-dev-key-stack4}
      Waha__WebhookCallbackUrl: "http://api:8080/webhooks/waha"
      # Proxy por chip (anti-correlacao de IP): aplicado no config da sessao via API do WAHA.
      # Vazio = sem proxy (sai pelo IP da maquina). Formato host:porta (sem http://). docs/proxy.md.
      Waha__ProxyServer: ${WAHA_PROXY_4:-}
      Waha__ProxyUsername: ${WAHA_PROXY_4_USER:-}
      Waha__ProxyPassword: ${WAHA_PROXY_4_PASS:-}
      Webhooks__WahaToken: ${WAHA4_HOOK_TOKEN:-}
      # Chave JWT distinta dos demais Stacks: tokens emitidos noutro stack não autenticam aqui
      Jwt__SigningKey: ${JWT4_SIGNING_KEY:-dev-only-signing-key-stack-4-change-me-32-chars-min}
      # Admin específico do Ambiente D — diferente dos outros pra ficar claro qual ambiente é qual
      Seed__Admin__Email: ${SEED4_ADMIN_EMAIL:-admin-d@local}
      Seed__Admin__Password: ${SEED4_ADMIN_PASS:-chipD123!}
      Seed__Admin__DisplayName: ${SEED4_ADMIN_NAME:-Admin Chip D}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: src/MtrxSys.Dispatcher/Dockerfile
    container_name: mtrx4-dispatcher
    environment:
      TZ: UTC
      DOTNET_ENVIRONMENT: Production
      # URL pública por onde o destinatário alcança ESTA API (link de "sair" de 1 clique no rodapé).
      # Vazio = link desligado (só "responda SAIR"). Defina OPTOUT_PUBLIC_URL_4 no .env no servidor.
      OptOut__PublicBaseUrl: ${OPTOUT_PUBLIC_URL_4:-}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG4_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA4_API_KEY:-mtrxsys-dev-key-stack4}
      Jwt__SigningKey: ${JWT4_SIGNING_KEY:-dev-only-signing-key-stack-4-change-me-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      args:
        # Cliente web do Stack 4 chama a API do Stack 4 (porta 5083). Build-time via Vite.
        VITE_API_URL: "http://localhost:5083"
        # Identifica a aba do navegador como "MtrxSys D" pra distinguir dos outros.
        VITE_APP_LABEL: "D"
    container_name: mtrx4-web
    ports:
      - "5177:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata4:
  waha-sessions4:
