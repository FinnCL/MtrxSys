# Stack 9 (espelho do docker-compose.yml/compose-2.yml). Landing fica só no compose-2.
#
# Sobe ao lado dos outros stacks com:
#   docker compose -f docker-compose-9.yml up -d
#
# Acessos:
#   - http://localhost:5175  → landing (no compose-2), agora com 9 cards (A, B, C, D, E, F, G, H, I)
#   - http://localhost:5182  → web do Stack 9 (Ambiente I / Chip I)
#   - http://localhost:5088  → API do Stack 9
#   - http://localhost:5442  → Postgres do Stack 9 (5440 fica reservada ao banco compartilhado)
#   - http://localhost:3008  → WAHA do Stack 9 (parear o nono celular aqui)
#
# Defaults pra DEV LOCAL. Em outro setup sobrescreva via .env (não commitado).

name: mtrx9

services:
  postgres:
    image: postgres:17-alpine
    container_name: mtrx9-postgres
    environment:
      POSTGRES_DB: mtrx
      POSTGRES_USER: mtrx
      POSTGRES_PASSWORD: ${PG9_PASS:-mtrx}
      TZ: UTC
    ports:
      - "5442:5432"
    volumes:
      - pgdata9:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mtrx", "-d", "mtrx"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtrx9-redis
    ports:
      - "6387:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: mtrx9-waha
    ports:
      - "3008:3000"
    environment:
      TZ: UTC
      # Engine NOWEB (sem Chromium) — ver docker-compose.yml. Reparear o chip após a troca.
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA9_DASH_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA9_DASH_PASS:-admin}
      WHATSAPP_API_KEY: ${WAHA9_API_KEY:-mtrxsys-dev-key-stack9}
      # Webhook aponta pro nome interno do serviço (resolvido pela rede do projeto mtrx9)
      WHATSAPP_HOOK_URL: ${WAHA9_HOOK_URL:-http://api:8080/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: ${WAHA9_HOOK_EVENTS:-message,message.any}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA9_SWAGGER_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA9_SWAGGER_PASS:-admin}
    volumes:
      - waha-sessions9:/app/.sessions
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/MtrxSys.Api/Dockerfile
    container_name: mtrx9-api
    ports:
      - "5088:8080"
    environment:
      TZ: UTC
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG9_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA9_API_KEY:-mtrxsys-dev-key-stack9}
      Waha__WebhookCallbackUrl: "http://api:8080/webhooks/waha"
      Webhooks__WahaToken: ${WAHA9_HOOK_TOKEN:-}
      # Chave JWT distinta dos demais Stacks: tokens emitidos noutro stack não autenticam aqui
      Jwt__SigningKey: ${JWT9_SIGNING_KEY:-dev-only-signing-key-stack-9-change-me-32-chars-min}
      # Admin específico do Ambiente I — diferente dos outros pra ficar claro qual ambiente é qual
      Seed__Admin__Email: ${SEED9_ADMIN_EMAIL:-admin-i@local}
      Seed__Admin__Password: ${SEED9_ADMIN_PASS:-chipI123!}
      Seed__Admin__DisplayName: ${SEED9_ADMIN_NAME:-Admin Chip I}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: src/MtrxSys.Dispatcher/Dockerfile
    container_name: mtrx9-dispatcher
    environment:
      TZ: UTC
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG9_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA9_API_KEY:-mtrxsys-dev-key-stack9}
      Jwt__SigningKey: ${JWT9_SIGNING_KEY:-dev-only-signing-key-stack-9-change-me-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      args:
        # Cliente web do Stack 9 chama a API do Stack 9 (porta 5088). Build-time via Vite.
        VITE_API_URL: "http://localhost:5088"
        # Identifica a aba do navegador como "MtrxSys I" pra distinguir dos outros.
        VITE_APP_LABEL: "I"
    container_name: mtrx9-web
    ports:
      - "5182:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata9:
  waha-sessions9:
