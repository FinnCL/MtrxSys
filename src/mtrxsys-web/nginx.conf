server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Assets com hash no nome (Vite muda o nome a cada build) → conteúdo imutável, cache longo.
    # Um único Cache-Control (sem `expires`, que duplicaria o header).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html e fallback de SPA: NUNCA cachear. Assim, depois de um deploy, o navegador SEMPRE
    # revalida e pega o build novo (com o novo hash dos assets) — sem precisar de hard-refresh.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
