<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <style>
    /* Tokens identicos aos do App.css pra o visual ficar igual ao login do app. */
    :root {
      --bg: #0d1117;
      --bg-2: #161b22;
      --bg-3: #21262d;
      --fg: #e6edf3;
      --muted: #7d8590;
      --border: #30363d;
      --accent: #2dd4bf;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 18px;
    }

    /* Os 2 cards usam exatamente o mesmo style do .login-card da LoginScreen — clone direto */
    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }
    .login-card {
      background: var(--bg-2);
      padding: 16px;
      border-radius: 8px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid var(--border);
    }
    .login-card h1 { margin: 0 0 2px; font-size: 18px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    /* Host (localhost:porta) que o card abre — preenchido via JS a partir do mapa ENVS. */
    .env-host { font-size: 12px; font-weight: 400; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .login-card label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    .login-card input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    .login-card input:focus { outline: none; border-color: var(--accent); }
    .login-card button[type="submit"] {
      background: var(--accent);
      color: #052824;
      border: none;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }
    .login-card button[type="submit"]:hover:not(:disabled) { filter: brightness(1.15); }
    .login-card button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error { color: var(--danger); margin: 0; font-size: 12px; min-height: 1em; }

    /* Mostrar/esconder senha — mesmo padrao do App.css */
    .password-field { position: relative; display: flex; }
    .password-field input { width: 100%; padding-right: 36px; }
    .password-toggle {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle:hover { color: var(--fg); }

    .page-title { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }

    /* Estado "em uso": card travado enquanto o dashboard correspondente está aberto.
       Borda verde + badge no canto + botão disabled. JS abaixo controla a classe. */
    .login-card { position: relative; transition: border-color 0.2s; }
    .login-card.in-use { border-color: var(--accent); }
    .login-card.in-use::before {
      content: "🟢 Em uso";
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .login-card.in-use input,
    .login-card.in-use .password-toggle { opacity: 0.55; pointer-events: none; }
    .login-card.in-use button[type="submit"] {
      background: var(--bg-3);
      color: var(--muted);
      cursor: not-allowed;
    }
    .login-card.in-use button[type="submit"]:hover { filter: none; }

    /* 5 colunas (5 em cima / 5 embaixo) no desktop largo; reduz as colunas conforme
       a tela estreita, pra não estourar a largura em telas menores. */
    @media (max-width: 1100px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 780px; } }
    @media (max-width: 720px)  { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 520px; } }
    @media (max-width: 460px)  { .cards { grid-template-columns: 1fr; max-width: 320px; } body { padding: 12px; } }
  </style>
</head>

  <script>
    // Olho mostrar/esconder senha — adiciona/remove o traco cruzado no SVG igual a LoginScreen.tsx
    document.querySelectorAll(".password-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = btn.parentElement.querySelector("input");
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        btn.setAttribute("aria-label", hidden ? "Ocultar senha" : "Mostrar senha");
        const svg = btn.querySelector("svg");
        const existingLine = svg.querySelector("line");
        if (hidden && !existingLine) {
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", "3");
          line.setAttribute("y1", "3");
          line.setAttribute("x2", "21");
          line.setAttribute("y2", "21");
          svg.appendChild(line);
        } else if (!hidden && existingLine) {
          existingLine.remove();
        }
      });
    });

    // Mapa: qual backend cada card autentica, pra qual frontend redireciona depois.
    // Alinhado com docker-compose.yml (Stack 1), docker-compose-2.yml (Stack 2) e -3.yml (Stack 3).
    const ENVS = {
      a: { backend: "http://localhost:5080", target: "http://localhost:5173" },
      b: { backend: "http://localhost:5081", target: "http://localhost:5174" },
      c: { backend: "http://localhost:5082", target: "http://localhost:5176" },
      d: { backend: "http://localhost:5083", target: "http://localhost:5177" },
      e: { backend: "http://localhost:5084", target: "http://localhost:5178" },
      f: { backend: "http://localhost:5085", target: "http://localhost:5179" },
      g: { backend: "http://localhost:5086", target: "http://localhost:5180" },
      h: { backend: "http://localhost:5087", target: "http://localhost:5181" },
      i: { backend: "http://localhost:5088", target: "http://localhost:5182" },
      j: { backend: "http://localhost:5089", target: "http://localhost:5183" },
    };

    function setCardLocked(env, locked) {
      const card = document.querySelector(`form[data-env="${env}"]`);
      if (!card) return;
      // Se o card já está no estado certo, não toca (evita flicker do textContent durante render).
      if (card.classList.contains("in-use") === locked) return;
      card.classList.toggle("in-use", locked);
      const btn = card.querySelector("button[type=submit]");
      btn.disabled = locked;
      btn.textContent = locked ? "Em uso" : "Entrar";
    }

    // Fonte de verdade do lock: GET /api/presence/status de cada backend. O backend conta
    // as conexões SSE abertas do dashboard (data.active = há alguma aba aberta). Sobrevive a
    // F5 da landing (estado vive no backend, não em memória do JS).
    // Debounce: só destrava após 2 leituras inativas seguidas (~4s), pra um F5/reconexão do
    // dashboard (queda rápida do SSE) não piscar o card como livre. Trava na 1ª leitura ativa.
    const inactiveStreak = {};
    async function pollPresence(env) {
      const cfg = ENVS[env];
      try {
        const resp = await fetch(`${cfg.backend}/api/presence/status`, { cache: "no-store" });
        if (!resp.ok) {
          inactiveStreak[env] = 0;
          setCardLocked(env, false);
          return;
        }
        const data = await resp.json();
        if (data.active) {
          inactiveStreak[env] = 0;
          setCardLocked(env, true);
        } else {
          inactiveStreak[env] = (inactiveStreak[env] || 0) + 1;
          if (inactiveStreak[env] >= 2) setCardLocked(env, false);
        }
      } catch {
        // Backend down/inalcançável — destrava (fail open). Tentar logar aí vai falhar
        // de qualquer jeito e a mensagem de erro de rede aparece.
        inactiveStreak[env] = 0;
        setCardLocked(env, false);
      }
    }

    function pollAll() {
      for (const env of Object.keys(ENVS)) {
        pollPresence(env);
      }
    }
    pollAll();
    setInterval(pollAll, 2000);

    document.querySelectorAll("form[data-env]").forEach((form) => {
      // Mostra, ao lado do título, qual localhost este card abre. Fonte única: o mapa ENVS,
      // então realocar uma porta lá reflete aqui sem editar o HTML de cada card.
      const host = ENVS[form.dataset.env]?.target;
      if (host) {
        const span = document.createElement("span");
        span.className = "env-host";
        span.textContent = host.replace(/^https?:\/\//, "");
        form.querySelector("h1").appendChild(span);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const env = form.dataset.env;
        // Defesa em camada: se já está em uso, ignora (alem do disabled visual).
        if (form.classList.contains("in-use")) return;
        const cfg = ENVS[env];
        const errEl = form.querySelector("[data-err]");
        const btn = form.querySelector("button[type=submit]");
        errEl.textContent = "";
        btn.disabled = true;
        const originalLabel = btn.textContent;
        btn.textContent = "Entrando...";
        try {
          const resp = await fetch(`${cfg.backend}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: form.email.value,
              password: form.password.value,
            }),
          });
          if (!resp.ok) {
            const txt = await resp.text().catch(() => "");
            errEl.textContent = `Erro ${resp.status}${txt ? ": " + txt.slice(0, 200) : ""}`;
            btn.disabled = false;
            btn.textContent = originalLabel;
            return;
          }
          const data = await resp.json();
          // Manda o JWT + dados do usuario pelo fragment da URL (nao vai pro servidor) — o
          // AuthContext.tsx do app consome e limpa do historico no mesmo instante.
          const userPayload = JSON.stringify({
            userId: data.userId,
            email: data.email,
            displayName: data.displayName,
          });
          const params = new URLSearchParams({
            token: data.accessToken,
            user: userPayload,
          });
          const newWin = window.open(`${cfg.target}/#${params.toString()}`, "_blank");
          if (newWin) {
            // Trava otimista do card: cobre o gap até a aba nova abrir o SSE de presença
            // (~1s do boot do React). O polling continua e mantém a verdade via backend.
            inactiveStreak[env] = 0;
            setCardLocked(env, true);
          } else {
            errEl.textContent = "Permita popups deste site pra abrir o dashboard em nova aba.";
            btn.disabled = false;
            btn.textContent = originalLabel;
          }
        } catch (ex) {
          errEl.textContent = `Erro de rede: ${ex.message || ex}`;
          btn.disabled = false;
          btn.textContent = originalLabel;
        }
      });
    });
  </script>
