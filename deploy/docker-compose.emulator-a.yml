# docker-android ORQUESTRADO do ambiente A: sem volume (persistencia via commit-to-image, pois volume
# no AVD trava o boot). Na rede do stack (alcanca gost). Proxy aplicado pos-boot (http_proxy=gost).
services:
  dandroid:
    image: budtmo/docker-android:emulator_14.0
    container_name: mtrx-dandroid
    # FIX self-healing: limpa o lock X travado (/tmp/.X0-lock do boot anterior) ANTES de subir o display.
    # Sem isso, o Xvfb vê o display :0 "em uso" e o d_screen/vnc/d_wm vão FATAL — era a causa raiz de:
    # (1) docker start falhar após crash, (2) commit-to-image não bootar, (3) perda de conta a cada crash.
    # Com a limpeza no start, o emulador se reergue sozinho (com restart: unless-stopped) SEM perder a conta.
    entrypoint: ["sh", "-c"]
    command:
      - 'rm -f /tmp/.X*-lock 2>/dev/null; rm -rf /tmp/.X11-unix/* /home/androidusr/emulator/*.lock 2>/dev/null; exec "$$APP_PATH"/mixins/scripts/run.sh'
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      EMULATOR_NO_SKIN: "true"
      # Display do noVNC = largura do DEVICE (Galaxy S10 renderiza ~402px na altura 850). Antes 500 ->
      # sobravam ~98px de desktop (o "ANDROID") = bezel lateral. 404 = device + 2px de folga -> o device
      # PREENCHE a caixa de recorte da tela (.phone-screen no App.css, que hoje NAO desenha moldura de
      # celular: so mantem o aspect-ratio e corta a barra do noVNC). O watchdog centraliza + escurece a folga.
      SCREEN_WIDTH: "404"
      SCREEN_HEIGHT: "850"
      SCREEN_DEPTH: "24"
    volumes:
      - /home/ubuntu/emulator.py:/home/androidusr/docker-android/cli/src/device/emulator.py
    ports:
      - "127.0.0.1:6090:6080"
    restart: unless-stopped
