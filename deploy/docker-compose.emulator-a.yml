# docker-android ORQUESTRADO do ambiente A: sem volume (persistencia via commit-to-image, pois volume
# no AVD trava o boot). Na rede do stack (alcanca gost). Proxy aplicado pos-boot (http_proxy=gost).
services:
  dandroid:
    # TAG DE TRABALHO, nao a upstream. Ate 25/07 este campo era `budtmo/docker-android:emulator_14.0`
    # e essa tag era SOBRESCRITA com commits do device em uso -> "recriar limpo" restaurava a
    # identidade acumulada (android_id/GSF/phoneid de 05-06/07) e o chip novo herdava a ficha do
    # queimado. Agora sao duas tags com papeis separados: `mtrx-android:golden` e o molde imutavel
    # (nunca registrou numero, nunca recebe commit) e `mtrx-android:live` e o estado de trabalho.
    # Construir/atualizar: deploy/build-golden-image-a.sh · aparelho novo: deploy/limpar-emulador-a.sh
    # · salvar chip registrado: deploy/salvar-estado-emulador-a.sh
    image: mtrx-android:live
    container_name: mtrx-dandroid
    # FIX self-healing: limpa o lock X travado (/tmp/.X0-lock do boot anterior) ANTES de subir o display.
    # Sem isso, o Xvfb vê o display :0 "em uso" e o d_screen/vnc/d_wm vão FATAL — era a causa raiz de:
    # (1) docker start falhar após crash, (2) commit-to-image não bootar, (3) perda de conta a cada crash.
    # Com a limpeza no start, o emulador se reergue sozinho (com restart: unless-stopped) SEM perder a conta.
    entrypoint: ["sh", "-c"]
    command:
      - 'rm -f /tmp/.X*-lock 2>/dev/null; rm -rf /tmp/.X11-unix/* /home/androidusr/emulator/*.lock 2>/dev/null; exec "$$APP_PATH"/mixins/scripts/run.sh'
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      EMULATOR_NO_SKIN: "true"
      # Display do noVNC = largura do DEVICE (Galaxy S10 renderiza ~402px na altura 850). Antes 500 ->
      # sobravam ~98px de desktop (o "ANDROID") = bezel lateral. 404 = device + 2px de folga -> o device
      # PREENCHE a caixa de recorte da tela (.phone-screen no App.css, que hoje NAO desenha moldura de
      # celular: so mantem o aspect-ratio e corta a barra do noVNC). O watchdog centraliza + escurece a folga.
      SCREEN_WIDTH: "404"
      SCREEN_HEIGHT: "850"
      SCREEN_DEPTH: "24"
      # GPU: swangle_indirect (render ANGLE) em vez do swiftshader_indirect default. O swiftshader estava
      # jogando GL_INVALID_OPERATION (0x502) em rajada no glAttachShader/resize e crashando o qemu ao abrir
      # o WhatsApp (conflito de resoluções 1440x3040 / 1696x3296 / 1624x720 num display 404x850 — provado
      # 2026-07-24). O emulator.py appenda EMULATOR_ADDITIONAL_ARGS DEPOIS do -gpu default, então o último
      # -gpu vence (sem editar o emulator.py do host). Ver docs/rebuild-emulator-a.md.
      EMULATOR_ADDITIONAL_ARGS: "-gpu swangle_indirect"
    volumes:
      - /home/ubuntu/emulator.py:/home/androidusr/docker-android/cli/src/device/emulator.py
    ports:
      - "127.0.0.1:6090:6080"
    restart: unless-stopped
