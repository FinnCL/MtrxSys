# Stack 6 (espelho do docker-compose.yml/compose-2.yml). Landing fica só no compose-2.
#
# Sobe ao lado dos outros stacks com:
#   docker compose -f docker-compose-6.yml up -d
#
# Acessos:
#   - http://localhost:5175  → landing (no compose-2), agora com 6 cards (A, B, C, D, E, F)
#   - http://localhost:5179  → web do Stack 6 (Ambiente F / Chip F)
#   - http://localhost:5085  → API do Stack 6
#   - http://localhost:5437  → Postgres do Stack 6 (porta diferente dos demais)
#   - http://localhost:3005  → WAHA do Stack 6 (parear o sexto celular aqui)
#
# Defaults pra DEV LOCAL. Em outro setup sobrescreva via .env (não commitado).

name: mtrx6

services:
  postgres:
    image: postgres:17-alpine
    container_name: mtrx6-postgres
    environment:
      POSTGRES_DB: mtrx
      POSTGRES_USER: mtrx
      POSTGRES_PASSWORD: ${PG6_PASS:-mtrx}
      TZ: UTC
    ports:
      - "5437:5432"
    volumes:
      - pgdata6:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mtrx", "-d", "mtrx"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtrx6-redis
    ports:
      - "6384:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: mtrx6-waha
    ports:
      - "3005:3000"
    environment:
      TZ: UTC
      # Engine NOWEB (sem Chromium) — ver docker-compose.yml. Reparear o chip após a troca.
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-NOWEB}
      # Proxy por chip (anti-correlacao de IP). Vazio = SEM proxy (comportamento atual).
      # Ligar: defina WAHA_PROXY_6=ip:porta (e _USER/_PASS) num .env e recrie o waha.
      WHATSAPP_PROXY_SERVER: ${WAHA_PROXY_6:-}
      WHATSAPP_PROXY_SERVER_USERNAME: ${WAHA_PROXY_6_USER:-}
      WHATSAPP_PROXY_SERVER_PASSWORD: ${WAHA_PROXY_6_PASS:-}
      # Bypass do proxy pro host INTERNO (api): sem isto, ao ligar um proxy o webhook
      # (waha -> http://api:8080/...) pode ir pelo proxy externo e o "SAIR" para de chegar
      # em silencio (risco de ban). Ver docs/proxy.md.
      NO_PROXY: "api,localhost,127.0.0.1"
      no_proxy: "api,localhost,127.0.0.1"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA6_DASH_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA6_DASH_PASS:-admin}
      WHATSAPP_API_KEY: ${WAHA6_API_KEY:-mtrxsys-dev-key-stack6}
      # Webhook aponta pro nome interno do serviço (resolvido pela rede do projeto mtrx6)
      WHATSAPP_HOOK_URL: ${WAHA6_HOOK_URL:-http://api:8080/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: ${WAHA6_HOOK_EVENTS:-message,message.any}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA6_SWAGGER_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA6_SWAGGER_PASS:-admin}
    volumes:
      - waha-sessions6:/app/.sessions
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/MtrxSys.Api/Dockerfile
    container_name: mtrx6-api
    ports:
      - "5085:8080"
    environment:
      TZ: UTC
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG6_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA6_API_KEY:-mtrxsys-dev-key-stack6}
      Waha__WebhookCallbackUrl: "http://api:8080/webhooks/waha"
      Webhooks__WahaToken: ${WAHA6_HOOK_TOKEN:-}
      # Chave JWT distinta dos demais Stacks: tokens emitidos noutro stack não autenticam aqui
      Jwt__SigningKey: ${JWT6_SIGNING_KEY:-dev-only-signing-key-stack-6-change-me-32-chars-min}
      # Admin específico do Ambiente F — diferente dos outros pra ficar claro qual ambiente é qual
      Seed__Admin__Email: ${SEED6_ADMIN_EMAIL:-admin-f@local}
      Seed__Admin__Password: ${SEED6_ADMIN_PASS:-chipF123!}
      Seed__Admin__DisplayName: ${SEED6_ADMIN_NAME:-Admin Chip F}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: src/MtrxSys.Dispatcher/Dockerfile
    container_name: mtrx6-dispatcher
    environment:
      TZ: UTC
      DOTNET_ENVIRONMENT: Production
      # URL pública por onde o destinatário alcança ESTA API (link de "sair" de 1 clique no rodapé).
      # Vazio = link desligado (só "responda SAIR"). Defina OPTOUT_PUBLIC_URL_6 no .env no servidor.
      OptOut__PublicBaseUrl: ${OPTOUT_PUBLIC_URL_6:-}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG6_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA6_API_KEY:-mtrxsys-dev-key-stack6}
      Jwt__SigningKey: ${JWT6_SIGNING_KEY:-dev-only-signing-key-stack-6-change-me-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      args:
        # Cliente web do Stack 6 chama a API do Stack 6 (porta 5085). Build-time via Vite.
        VITE_API_URL: "http://localhost:5085"
        # Identifica a aba do navegador como "MtrxSys F" pra distinguir dos outros.
        VITE_APP_LABEL: "F"
    container_name: mtrx6-web
    ports:
      - "5179:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata6:
  waha-sessions6:
