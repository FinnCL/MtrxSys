# Stack 3 (espelho do docker-compose.yml/compose-2.yml). Landing fica só no compose-2.
#
# Sobe ao lado dos outros stacks com:
#   docker compose -f docker-compose-3.yml up -d
#
# Acessos:
#   - http://localhost:5175  → landing (no compose-2), agora com 3 cards (A, B, C)
#   - http://localhost:5176  → web do Stack 3 (Ambiente C / Chip C)
#   - http://localhost:5082  → API do Stack 3
#   - http://localhost:5434  → Postgres do Stack 3 (porta diferente dos demais)
#   - http://localhost:3002  → WAHA do Stack 3 (parear o terceiro celular aqui)
#
# Defaults pra DEV LOCAL. Em outro setup sobrescreva via .env (não commitado).

name: mtrx3

services:
  postgres:
    image: postgres:17-alpine
    container_name: mtrx3-postgres
    environment:
      POSTGRES_DB: mtrx
      POSTGRES_USER: mtrx
      POSTGRES_PASSWORD: ${PG3_PASS:-mtrx}
      TZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - pgdata3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mtrx", "-d", "mtrx"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtrx3-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: mtrx3-waha
    ports:
      - "3002:3000"
    environment:
      TZ: UTC
      # Engine NOWEB (sem Chromium) — ver docker-compose.yml. Reparear o chip após a troca.
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA3_DASH_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA3_DASH_PASS:-admin}
      WHATSAPP_API_KEY: ${WAHA3_API_KEY:-mtrxsys-dev-key-stack3}
      # Webhook aponta pro nome interno do serviço (resolvido pela rede do projeto mtrx3)
      WHATSAPP_HOOK_URL: ${WAHA3_HOOK_URL:-http://api:8080/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: ${WAHA3_HOOK_EVENTS:-message,message.any}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA3_SWAGGER_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA3_SWAGGER_PASS:-admin}
    volumes:
      - waha-sessions3:/app/.sessions
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/MtrxSys.Api/Dockerfile
    container_name: mtrx3-api
    ports:
      - "5082:8080"
    environment:
      TZ: UTC
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG3_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA3_API_KEY:-mtrxsys-dev-key-stack3}
      Waha__WebhookCallbackUrl: "http://api:8080/webhooks/waha"
      Webhooks__WahaToken: ${WAHA3_HOOK_TOKEN:-}
      # Chave JWT distinta dos Stacks 1 e 2: tokens emitidos noutro stack não autenticam aqui
      Jwt__SigningKey: ${JWT3_SIGNING_KEY:-dev-only-signing-key-stack-3-change-me-32-chars-min}
      # Admin específico do Ambiente C — diferente dos outros pra ficar claro qual ambiente é qual
      Seed__Admin__Email: ${SEED3_ADMIN_EMAIL:-admin-c@local}
      Seed__Admin__Password: ${SEED3_ADMIN_PASS:-chipC123!}
      Seed__Admin__DisplayName: ${SEED3_ADMIN_NAME:-Admin Chip C}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: src/MtrxSys.Dispatcher/Dockerfile
    container_name: mtrx3-dispatcher
    environment:
      TZ: UTC
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG3_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA3_API_KEY:-mtrxsys-dev-key-stack3}
      Jwt__SigningKey: ${JWT3_SIGNING_KEY:-dev-only-signing-key-stack-3-change-me-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      args:
        # Cliente web do Stack 3 chama a API do Stack 3 (porta 5082). Build-time via Vite.
        VITE_API_URL: "http://localhost:5082"
        # Identifica a aba do navegador como "MtrxSys C" pra distinguir dos outros.
        VITE_APP_LABEL: "C"
    container_name: mtrx3-web
    ports:
      - "5176:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata3:
  waha-sessions3:
