services:
  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./src/mtrxsys-web:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_URL: "http://localhost:5080"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
