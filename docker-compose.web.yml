# Override de DEV — HMR SO DO FRONT (Stack A). Use com o base:
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up -d --build
# So o 'web' vira Vite dev server (recarrega ao editar .tsx). A api/dispatcher seguem
# build normal (sem dotnet watch) — ao mexer em C#, rode: rebuild-backend.cmd
services:
  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      target: dev
    # Vite na MESMA porta publicada (5173) pro websocket de HMR bater certo.
    ports: !override
      - "5173:5173"
    volumes:
      - ./src/mtrxsys-web:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_URL: "http://localhost:5080"
      VITE_APP_LABEL: "A"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
