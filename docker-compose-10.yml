# Stack 10 (espelho do docker-compose.yml/compose-2.yml). Landing fica só no compose-2.
#
# Sobe ao lado dos outros stacks com:
#   docker compose -f docker-compose-10.yml up -d
#
# Acessos:
#   - http://localhost:5175  → landing (no compose-2), agora com 10 cards (A, B, C, D, E, F, G, H, I, J)
#   - http://localhost:5183  → web do Stack 10 (Ambiente J / Chip J)
#   - http://localhost:5089  → API do Stack 10
#   - http://localhost:5441  → Postgres do Stack 10 (porta diferente dos demais)
#   - http://localhost:3009  → WAHA do Stack 10 (parear o décimo celular aqui)
#
# Defaults pra DEV LOCAL. Em outro setup sobrescreva via .env (não commitado).

name: mtrx10

services:
  postgres:
    image: postgres:17-alpine
    container_name: mtrx10-postgres
    environment:
      POSTGRES_DB: mtrx
      POSTGRES_USER: mtrx
      POSTGRES_PASSWORD: ${PG10_PASS:-mtrx}
      TZ: UTC
    ports:
      - "${MTRX_BIND:-127.0.0.1}:5441:5432"
    volumes:
      - pgdata10:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mtrx", "-d", "mtrx"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtrx10-redis
    ports:
      - "${MTRX_BIND:-127.0.0.1}:6388:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: mtrx10-waha
    ports:
      - "${MTRX_BIND:-127.0.0.1}:3009:3000"
    environment:
      TZ: UTC
      # Engine NOWEB (sem Chromium) — ver docker-compose.yml. Reparear o chip após a troca.
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-NOWEB}
      # NAO ha proxy aqui: o WAHA 2026.x (CORE/NOWEB) IGNORA a env var WHATSAPP_PROXY_SERVER
      # (comprovado). O proxy por chip e aplicado no CONFIG DA SESSAO pela api (Waha__Proxy*).
      # Ver docs/proxy.md.
      # Bypass do proxy pro host INTERNO (api): sem isto, ao ligar um proxy o webhook
      # (waha -> http://api:8080/...) pode ir pelo proxy externo e o "SAIR" para de chegar
      # em silencio (risco de ban). Ver docs/proxy.md.
      NO_PROXY: "api,localhost,127.0.0.1"
      no_proxy: "api,localhost,127.0.0.1"
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA10_DASH_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA10_DASH_PASS:-admin}
      WHATSAPP_API_KEY: ${WAHA10_API_KEY:-mtrxsys-dev-key-stack10}
      # Webhook aponta pro nome interno do serviço (resolvido pela rede do projeto mtrx10)
      WHATSAPP_HOOK_URL: ${WAHA10_HOOK_URL:-http://api:8080/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: ${WAHA10_HOOK_EVENTS:-message,message.any}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA10_SWAGGER_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA10_SWAGGER_PASS:-admin}
    volumes:
      - waha-sessions10:/app/.sessions
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/MtrxSys.Api/Dockerfile
    container_name: mtrx10-api
    ports:
      - "${MTRX_BIND:-127.0.0.1}:5089:8080"
    environment:
      TZ: UTC
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG10_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA10_API_KEY:-mtrxsys-dev-key-stack10}
      Waha__WebhookCallbackUrl: "http://api:8080/webhooks/waha"
      # Proxy por chip (anti-correlacao de IP): aplicado no config da sessao via API do WAHA.
      # Vazio = sem proxy (sai pelo IP da maquina). Formato host:porta (sem http://). docs/proxy.md.
      Waha__ProxyServer: ${WAHA_PROXY_10:-}
      Waha__ProxyUsername: ${WAHA_PROXY_10_USER:-}
      Waha__ProxyPassword: ${WAHA_PROXY_10_PASS:-}
      # Aparelho virtual (aba "Celular") — pronto no papel, DESLIGADO por padrão (ViewUrl vazio): sem
      # KVM/servidor nada sobe. Container/porta/volume ÚNICOS por ambiente (1 host, 10 stacks).
      Phone__ContainerName: ${PHONE_CONTAINER_10:-mtrx10-android}
      Phone__ViewUrl: ${PHONE_VIEW_URL_10:-}
      Phone__NoVncPort: ${PHONE_NOVNC_PORT_10:-6089}
      Phone__VolumeName: ${PHONE_VOLUME_10:-android-data-10}
      Phone__WhatsAppApkUrl: ${PHONE_WA_APK_URL_10:-}
      Presence__MaskChipPhone: ${MASK_CHIP_PHONE_10:-false}
      Webhooks__WahaToken: ${WAHA10_HOOK_TOKEN:-}
      # Chave JWT distinta dos demais Stacks: tokens emitidos noutro stack não autenticam aqui
      # FASE HUMANA (dias 1-3 de um chip NOVO): trava o DISPARO enquanto o operador conversa a mao
      # pela aba Chat; abre sozinha quando ha evidencia (gente que respondeu) + dias com atividade.
      # VAZIO = DESLIGADO, e este e o default: sem HUMAN_PHASE_FROM no .env nada muda.
      # Pra ligar, use uma data >= a do DEPLOY: so chips ANCORADOS a partir dela (pareados ou
      # re-pareados depois) entram na fase. Chip que ja roda nunca para. Mesma data nos 10 stacks.
      HumanPhase__EffectiveFrom: ${HUMAN_PHASE_FROM:-}
      Jwt__SigningKey: ${JWT10_SIGNING_KEY:-dev-only-signing-key-stack-10-change-me-32-chars-min}
      # Admin específico do Ambiente J — diferente dos outros pra ficar claro qual ambiente é qual
      Seed__Admin__Email: ${SEED10_ADMIN_EMAIL:-admin-j@local}
      Seed__Admin__Password: ${SEED10_ADMIN_PASS:-chipJ123!}
      Seed__Admin__DisplayName: ${SEED10_ADMIN_NAME:-Admin Chip J}
    volumes:
      # Socket do Docker: deixa a API ligar/parar/logar o container do emulador (deploy Linux).
      # Sem o socket acessível, a aba "Celular" mostra "indisponível" (fail-safe).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: src/MtrxSys.Dispatcher/Dockerfile
    container_name: mtrx10-dispatcher
    environment:
      TZ: UTC
      DOTNET_ENVIRONMENT: Production
      # URL pública por onde o destinatário alcança ESTA API (link de "sair" de 1 clique no rodapé).
      # Vazio = link desligado (só "responda SAIR"). Defina OPTOUT_PUBLIC_URL_10 no .env no servidor.
      OptOut__PublicBaseUrl: ${OPTOUT_PUBLIC_URL_10:-}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mtrx;Username=mtrx;Password=${PG10_PASS:-mtrx}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: ${WAHA10_API_KEY:-mtrxsys-dev-key-stack10}
      # FASE HUMANA (dias 1-3 de um chip NOVO): trava o DISPARO enquanto o operador conversa a mao
      # pela aba Chat; abre sozinha quando ha evidencia (gente que respondeu) + dias com atividade.
      # VAZIO = DESLIGADO, e este e o default: sem HUMAN_PHASE_FROM no .env nada muda.
      # Pra ligar, use uma data >= a do DEPLOY: so chips ANCORADOS a partir dela (pareados ou
      # re-pareados depois) entram na fase. Chip que ja roda nunca para. Mesma data nos 10 stacks.
      HumanPhase__EffectiveFrom: ${HUMAN_PHASE_FROM:-}
      Jwt__SigningKey: ${JWT10_SIGNING_KEY:-dev-only-signing-key-stack-10-change-me-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      args:
        # Cliente web do Stack 10 chama a API do Stack 10 (porta 5089). Build-time via Vite.
        VITE_API_URL: "http://localhost:5089"
        # Aparelho virtual: build args do emulador embutido (vazio = desligado, igual A/B).
        VITE_EMULATOR_URL: ${PHONE_VIEW_URL_10:-}
        VITE_EMULATOR_KIND: ${PHONE_VIEWER_KIND_10:-}
        VITE_PHONE_SERVER: ${PHONE_SERVER_OPTION_10:-}
        VITE_EMULATOR_UDID: ${PHONE_UDID_10:-}
        # Identifica a aba do navegador como "MtrxSys J" pra distinguir dos outros.
        VITE_APP_LABEL: "J"
    container_name: mtrx10-web
    ports:
      - "${MTRX_BIND:-127.0.0.1}:5183:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata10:
  waha-sessions10:
