# Override de DEV — HMR SO DO FRONT (Stack F). Use com o base:
#   docker compose -f docker-compose-6.yml -f docker-compose-6.web.yml up -d --build
# So o 'web' vira Vite dev server (recarrega ao editar .tsx). A api/dispatcher seguem
# build normal (sem dotnet watch) — ao mexer em C#, rode: rebuild-backend.cmd
services:
  web:
    build:
      context: ./src/mtrxsys-web
      dockerfile: Dockerfile
      target: dev
    # Vite na MESMA porta publicada (5179) pro websocket de HMR bater certo.
    ports: !override
      - "${MTRX_BIND:-127.0.0.1}:5179:5179"
    volumes:
      - ./src/mtrxsys-web:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_URL: "http://localhost:5085"
      VITE_APP_LABEL: "F"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5179"]
